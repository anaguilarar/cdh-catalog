id: chirts-daily-v1
title: "CHIRTS-daily: Global Daily Maximum and Minimum Temperature"
series:
  name: CHIRTS
  url: https://www.chc.ucsb.edu/data/chirts
description: >-
  CHIRTS-daily provides global, daily estimates of maximum (tmax) and minimum (tmin) 2-meter air
  temperature at 0.05° resolution (~5 km). It blends infrared satellite observations with in-situ
  station data using a modified version of the CHIRPS algorithm. The dataset spans 1983-present with
  daily temporal resolution, supporting climate monitoring, agricultural modeling, and heat-stress
  studies.
license: CC-BY-4.0
